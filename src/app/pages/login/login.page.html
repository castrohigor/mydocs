<ion-content class="ion-padding" [fullscreen]="true">
  <div class="hero">
    <div class="stack" aria-hidden="true">
      <div class="card c1"></div>
      <div class="card c2"></div>
      <div class="card c3"><span>CNH</span></div>
    </div>

    <h1>MyDocs</h1>
    <p class="muted">
      Sua carteira de documentos. Guarde PDFs, fotos e planilhas no seu Google Drive e encontre tudo em segundos.
    </p>

    <ion-button expand="block" shape="round" size="large" (click)="login()" [disabled]="busy()">
      @if (busy()) {
        <ion-spinner name="crescent" />
      } @else {
        <ion-icon slot="start" name="logo-google" />
        Entrar com Google
      }
    </ion-button>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <p class="fine muted">
      O MyDocs só acessa os arquivos que ele mesmo salvar no seu Drive, dentro da pasta <b>MyDocs</b>.
    </p>
  </div>
</ion-content>
